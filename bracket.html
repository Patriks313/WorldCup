<!doctype html>
<!-- bracket_v5  ·  World Cup 2026 — Road to the Final  ·  mirrored layout + to-proceed market odds -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road to the Final — World Cup 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Archivo+Narrow:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d12; --bg2:#0e131a; --panel:#121922; --panel2:#16202b;
  --line:#243040; --line2:#2e3c4f;
  --ink:#e9eef4; --mut:#8896a6; --dim:#5f6c7c;
  --amber:#f5b21a; --amber-d:#ca900f;
  --green:#2fcf8e; --green-d:#1d7d57;
  --blue:#52a7ff; --red:#ff6b6b;
  --win:#1a2a22; --route:#f5b21a;
}
*{box-sizing:border-box}
html,body{margin:0;background:
  radial-gradient(1200px 600px at 80% -10%, #122033 0%, transparent 60%),
  radial-gradient(900px 500px at -10% 10%, #14202c 0%, transparent 55%),
  var(--bg);
  color:var(--ink); font-family:Archivo,system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:18px 14px 60px}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:"JetBrains Mono",monospace}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.eyebrow{font-family:"Archivo Narrow";text-transform:uppercase;letter-spacing:.28em;font-size:11px;color:var(--amber);font-weight:700}
h1{font-size:clamp(26px,5vw,42px);line-height:.96;margin:2px 0 0;font-weight:800;letter-spacing:-.01em}
h1 .ghost{color:var(--dim);font-weight:600}
.sub{color:var(--mut);font-size:13px;margin-left:auto;max-width:360px;text-align:right;line-height:1.35}
.sub b{color:var(--ink);font-weight:700}

/* mode rail */
.rail{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 14px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{font-family:"Archivo Narrow";font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;
  color:var(--mut);background:none;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;transition:.15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,var(--amber),var(--amber-d));color:#1a1305;box-shadow:0 2px 10px rgba(245,178,26,.25)}
.toggle{display:inline-flex;align-items:center;gap:9px;color:var(--mut);font-size:13px;font-family:"Archivo Narrow";font-weight:600;text-transform:uppercase;letter-spacing:.05em;user-select:none;cursor:pointer}
.switch{width:40px;height:22px;border-radius:99px;background:var(--line2);position:relative;transition:.18s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:.18s}
.toggle[aria-pressed=true] .switch{background:var(--green-d)}
.toggle[aria-pressed=true] .switch::after{left:20px;background:var(--green)}
.spacer{flex:1 1 auto}
.action{font-family:"Archivo Narrow";font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink);background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:9px 13px;cursor:pointer;transition:.15s}
.action:hover{border-color:var(--amber);color:var(--amber)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:8px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.champ{position:relative;overflow:hidden}
.champ::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 200px at 18% -30%,rgba(245,178,26,.18),transparent 70%);pointer-events:none}
.lbl{font-family:"Archivo Narrow";text-transform:uppercase;letter-spacing:.2em;font-size:11px;color:var(--mut);font-weight:700}
.champ .name{font-size:clamp(30px,6.5vw,52px);font-weight:800;line-height:1;margin:6px 0 4px;letter-spacing:-.02em}
.champ .meta{color:var(--mut);font-size:13px}
.champ .pct{position:absolute;right:16px;top:14px;text-align:right}
.champ .pct .big{font-size:30px;font-weight:800;color:var(--amber)}
.champ .pct .cap{font-family:"Archivo Narrow";text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--mut)}
.finalrow{display:flex;align-items:center;gap:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.fteam{flex:1;min-width:0}
.fteam .lbl2{font-family:"Archivo Narrow";text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--dim)}
.fteam .t{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{font-family:"Archivo Narrow";font-weight:700;color:var(--dim);font-size:13px}

/* contenders table */
.tbl{width:100%;border-collapse:collapse}
.tbl caption{caption-side:top;text-align:left;font-family:"Archivo Narrow";text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--mut);font-weight:700;padding-bottom:8px}
.tbl td,.tbl th{padding:5px 6px;font-size:13px;border-bottom:1px solid var(--line)}
.tbl th{text-align:right;color:var(--dim);font-family:"Archivo Narrow";font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.tbl td.team{text-align:left;font-weight:600}
.tbl td.num{text-align:right}
.bar{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--amber),var(--amber-d));min-width:2px}
.tbl tr:last-child td{border-bottom:0}
.rank{color:var(--dim);width:20px;text-align:right;padding-right:8px}

/* sub-controls */
.subctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 10px}
.halves{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px}
.halves button{font-family:"Archivo Narrow";font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--mut);background:none;border:0;padding:7px 11px;border-radius:7px;cursor:pointer}
.halves button[aria-pressed=true]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.hint{color:var(--dim);font-size:12px}

/* bracket */
.scroller{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:10px;
  scrollbar-color:var(--line2) transparent}
.bracket{display:flex;gap:0;min-width:max-content;padding-top:30px;position:relative}
.round{display:flex;flex-direction:column;justify-content:space-around;min-width:178px;position:relative}
.round.r-F{min-width:200px}
.rhead{position:absolute;top:-26px;left:8px;right:8px;font-family:"Archivo Narrow";text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--dim);font-weight:700}
.rhead b{color:var(--amber)}
.match{margin:7px 11px;position:relative}
/* connector stubs */
.match.has-next::after{content:"";position:absolute;right:-11px;top:50%;width:11px;height:2px;background:var(--line2)}
.match.has-prev::before{content:"";position:absolute;left:-11px;top:50%;width:11px;height:2px;background:var(--line2)}
/* mirrored (bottom-half) columns flow inward → stubs flip to the opposite side */
.round.mirror .match.has-next::after{right:auto;left:-11px}
.round.mirror .match.has-prev::before{left:auto;right:-11px}
/* centre column (Final + third place): no stubs, it's the meeting point */
.round.centre .match::before,.round.centre .match::after{display:none}
.round.centre{align-items:center}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;transition:.15s}
.mcard.on-route{border-color:var(--route);box-shadow:0 0 0 1px var(--route),0 4px 18px rgba(245,178,26,.16)}
.mno{font-family:"Archivo Narrow";font-size:9px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;
  display:flex;justify-content:space-between;padding:2px 8px 0}
.tag{font-size:8.5px;font-weight:700;letter-spacing:.08em}
.tag.conf{color:var(--green)}
.tag.proj{color:var(--blue)}
.mno .rt{display:flex;gap:8px;align-items:center}
.score{font-size:8.5px;font-weight:700;letter-spacing:.04em;color:var(--mut);white-space:nowrap}
.slot{display:flex;align-items:center;gap:7px;padding:7px 8px;cursor:default;border-top:1px solid transparent}
.slot+.slot{border-top:1px solid var(--line)}
.clickable .slot{cursor:pointer}
.clickable .slot:hover{background:var(--panel2)}
.slot .nm{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.slot.adv .nm{color:var(--ink)}
.slot.out .nm{color:var(--dim)}
.slot.adv{background:linear-gradient(90deg,rgba(47,207,142,.10),transparent)}
.slot .pr{font-size:11px;color:var(--mut);flex:0 0 auto}
.slot.adv .pr{color:var(--green)}
.slot .pr.mkt,.slot.adv .pr.mkt{color:var(--amber)}   /* % came from the bookmaker's to-proceed price */
.slot .od{font-size:11px;color:var(--amber);flex:0 0 auto;font-weight:700}
.slot .tbd{color:var(--dim);font-style:italic;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--line2)}
.slot.adv .dot{background:var(--green)}
.on-route .slot.adv .dot{background:var(--route)}
.on-route .slot.adv{background:linear-gradient(90deg,rgba(245,178,26,.12),transparent)}
.on-route .slot.adv .pr{color:var(--amber)}

/* third place mini */
.tp{margin:18px 11px 0}
.tp .mcard{opacity:.92}

footer{margin-top:30px;border-top:1px solid var(--line);padding-top:14px;color:var(--dim);font-size:12px;line-height:1.5}
footer b{color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0 4px;font-size:12px;color:var(--mut)}
.legend i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:520px){
  .sub{text-align:left;margin-left:0;max-width:none}
  .champ .pct{position:static;text-align:left;margin-top:4px;display:flex;align-items:baseline;gap:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">FIFA World Cup 2026 · Knockout</div>
      <h1>Road to the <span class="ghost">Final</span></h1>
    </div>
    <div class="sub" id="datanote"></div>
  </header>

  <div class="rail">
    <div class="seg" role="tablist" aria-label="View mode">
      <button id="m-current" aria-pressed="true">Current bracket</button>
      <button id="m-est" aria-pressed="false">Best estimate</button>
    </div>
    <div class="toggle" id="hostbtn" role="switch" aria-pressed="false" tabindex="0" title="Add a home-soil bump for USA, Mexico and Canada">
      <span class="switch"></span><span>Host edge</span>
    </div>
    <span class="spacer"></span>
    <button class="action" id="resetbtn" style="display:none">Reset picks</button>
    <button class="action" id="resimbtn" style="display:none">Re-run 10,000</button>
  </div>

  <section class="hero">
    <div class="card champ">
      <div class="lbl" id="herolbl">Projected champion</div>
      <div class="name" id="champ">—</div>
      <div class="meta" id="champmeta"></div>
      <div class="pct" id="champpct"></div>
      <div class="finalrow" id="finalrow"></div>
    </div>
    <div class="card" id="oddscard">
      <table class="tbl tnum"><caption id="tblcap">Title odds — top 10</caption>
        <thead><tr><th class="rank"></th><th style="text-align:left">Team</th><th>Reach final</th><th>Win</th><th style="width:64px"></th></tr></thead>
        <tbody id="oddsbody"></tbody>
      </table>
    </div>
  </section>

  <div class="subctl">
    <div class="halves" role="tablist" aria-label="Bracket half">
      <button id="h-full" aria-pressed="true">Full draw</button>
      <button id="h-top" aria-pressed="false">Top half</button>
      <button id="h-bot" aria-pressed="false">Bottom half</button>
    </div>
    <span class="hint" id="modehint"></span>
  </div>

  <div class="scroller">
    <div class="bracket" id="bracket"></div>
  </div>

  <div class="legend">
    <i><span class="sw" style="background:var(--green)"></span>advances</i>
    <i><span class="tag conf">CONFIRMED</span>&nbsp;result is in</i>
    <i><span class="tag proj">PROJECTED</span>&nbsp;model fill</i>
  </div>

  <footer id="foot"></footer>
</div>

<script>
let DATA=null, P=null, M=null, PLAYED=null, PSCORE=null, PROCEED=null;   // populated by buildDATA() after the live DB loads

// fixed FIFA R32 tree: group-position anchors + 3rd-place allowed-group sets
const R32SPEC={73:['A2','B2'],74:['E1','3:ABCDF'],75:['F1','C2'],76:['C1','F2'],77:['I1','3:CDFGH'],78:['E2','I2'],79:['A1','3:CEFHI'],80:['L1','3:EHIJK'],81:['D1','3:BEFIJ'],82:['G1','3:AEHIJ'],83:['K2','L2'],84:['H1','J2'],85:['B1','3:EFGIJ'],86:['J1','H2'],87:['K1','3:DEIJL'],88:['D2','G2']};
const FEED={89:[74,77],90:[73,75],91:[76,78],92:[79,80],93:[83,84],94:[81,82],95:[86,88],96:[85,87],97:[89,90],98:[93,94],99:[91,92],100:[95,96],101:[97,98],102:[99,100],104:[101,102],103:[101,102]};

// Build the bracket data object straight from worldcup_db.json.
function buildDATA(db){
  const wc=db.world_cups.find(w=>w.year===2026); const points={}; wc.teams.forEach(t=>points[t.team]=t.fifa_points);
  const t2g={}; db.odds.matches.forEach(m=>{if(m.stage!=='knockout'&&m.group){t2g[m.home]=m.group;t2g[m.away]=m.group;}});
  const rec={}; Object.keys(t2g).forEach(t=>rec[t]={team:t,P:0,Pts:0,GD:0,GF:0});
  db.games.filter(g=>g.world_cup===2026&&g.stage==='group').forEach(g=>{const a=g.ft[0],b=g.ft[1];
    rec[g.home].P++;rec[g.home].GF+=a;rec[g.home].GD+=a-b; rec[g.away].P++;rec[g.away].GF+=b;rec[g.away].GD+=b-a;
    if(g.result==='1')rec[g.home].Pts+=3;else if(g.result==='2')rec[g.away].Pts+=3;else{rec[g.home].Pts++;rec[g.away].Pts++;}});
  const letters=[...new Set(Object.values(t2g))].sort(); const teamsIn=L=>Object.keys(t2g).filter(t=>t2g[t]===L);
  const groupComplete={}; letters.forEach(L=>groupComplete[L]=teamsIn(L).every(t=>rec[t].P>=3));
  const proj=JSON.parse(JSON.stringify(rec));
  db.odds.matches.filter(m=>m.stage!=='knockout'&&m.game_no_in_wc==null).forEach(m=>{const fav=points[m.home]>=points[m.away]?m.home:m.away,dog=fav===m.home?m.away:m.home;
    proj[fav].P++;proj[dog].P++;proj[fav].Pts+=3;proj[fav].GF++;proj[fav].GD++;proj[dog].GD--;});
  const cmp=(x,y)=>y.Pts-x.Pts||y.GD-x.GD||y.GF-x.GF;
  const std={}; letters.forEach(L=>std[L]=teamsIn(L).map(t=>proj[t]).sort(cmp));
  let thirds=letters.map(L=>({grp:L,...std[L][2]})).sort(cmp); thirds.forEach((t,i)=>t.qual=i<8);
  const qualGroups=thirds.filter(t=>t.qual).map(t=>t.grp);
  const gp=tok=>({team:std[tok[0]][+tok[1]-1].team,real:groupComplete[tok[0]]});
  const thirdTeamOfGroup=g=>std[g][2].team;
  const thirdSlots=Object.keys(R32SPEC).filter(s=>R32SPEC[s].some(x=>x[0]==='3')).map(Number);
  const allowed={}; thirdSlots.forEach(s=>allowed[s]=new Set(R32SPEC[s].find(x=>x[0]==='3').slice(2).split('')));
  const confirmedSlot={}, pinnedThirdGroup={};
  // teams that have already won a knockout tie — used to reject later-round (QF+) board lines from R32 slots
  const advanced=new Set(); db.games.filter(g=>g.world_cup===2026&&g.stage==='knockout').forEach(g=>{advanced.add(g.result==='1'?g.home:g.away);});
  db.odds.matches.filter(m=>m.stage==='knockout').forEach(line=>{
    const gno=line.game_no_in_wc;
    // 1) A frozen R32 line names its own slot via game_no_in_wc (73–88). Use it directly, no team-pattern guessing.
    if(gno>=73 && gno<=88){ confirmedSlot[gno]={a:line.home,b:line.away};
      const toks=R32SPEC[gno], th=toks.find(z=>z[0]==='3');
      if(th){ const anc=gp(toks.find(z=>z[0]!=='3')); const third=[line.home,line.away].find(t=>t!==anc.team); if(third) pinnedThirdGroup[gno]=t2g[third]; }
      return; }
    // 2) Any other line that carries a game_no is a later round (R16/QF/…) — never an R32 slot.
    if(gno!=null) return;
    // 3) An upcoming, undrawn line whose teams have already advanced is a later-round fixture — skip it.
    if(advanced.has(line.home)||advanced.has(line.away)) return;
    // 4) Genuine upcoming R32 line (both teams still group qualifiers): match to a slot by pattern.
    const pair=[line.home,line.away];
    for(const s of Object.keys(R32SPEC).map(Number)){
      if(confirmedSlot[s]) continue;
      const toks=R32SPEC[s], ga=toks.find(z=>z[0]!=='3');
      if(toks.every(z=>z[0]!=='3')){ const A=gp(toks[0]),B=gp(toks[1]);
        if(pair.includes(A.team)&&pair.includes(B.team)){confirmedSlot[s]={a:line.home,b:line.away};break;} }
      else { const anc=gp(ga);
        if(pair.includes(anc.team)){ const third=pair.find(t=>t!==anc.team);
          if(third&&allowed[s].has(t2g[third])){confirmedSlot[s]={a:line.home,b:line.away};pinnedThirdGroup[s]=t2g[third];break;} } }
    }
  });
  const pinnedSlots=Object.keys(pinnedThirdGroup).map(Number), pinnedGroups=new Set(Object.values(pinnedThirdGroup));
  const freeSlots=thirdSlots.filter(s=>!pinnedSlots.includes(s)), freeGroups=qualGroups.filter(g=>!pinnedGroups.has(g));
  let assign=null;
  (function bt(i,used,acc){ if(assign)return; if(i===freeSlots.length){assign={...acc};return;}
    const s=freeSlots[i]; for(const g of freeGroups){ if(!used.has(g)&&allowed[s].has(g)){used.add(g);acc[s]=g;bt(i+1,used,acc);used.delete(g);delete acc[s];} }
  })(0,new Set(),{});
  const slotThirdGroup={...pinnedThirdGroup,...(assign||{})};
  const MM={};
  for(const s of Object.keys(R32SPEC).map(Number)){
    if(confirmedSlot[s]){MM[s]={a:confirmedSlot[s].a,b:confirmedSlot[s].b,confirmed:true,round:'R32'};continue;}
    const x=R32SPEC[s][0],y=R32SPEC[s][1];
    const A=x[0]==='3'?{team:thirdTeamOfGroup(slotThirdGroup[s])}:gp(x);
    const B=y[0]==='3'?{team:thirdTeamOfGroup(slotThirdGroup[s])}:gp(y);
    MM[s]={a:A.team||null,b:B.team||null,confirmed:false,round:'R32'};
  }
  Object.entries(FEED).forEach(([id,f])=>{MM[id]={f,round:'R16'};});
  [97,98,99,100].forEach(i=>MM[i].round='QF');[101,102].forEach(i=>MM[i].round='SF');MM[104].round='F';MM[103].round='TP';MM[103].losers=true;
  // Real, played knockout results — these OVERRIDE the model so eliminated teams never advance.
  const played={}, pscore={};
  db.games.filter(g=>g.world_cup===2026 && g.stage==='knockout').forEach(g=>{
    const win = g.result==='1' ? g.home : g.away;
    played[g.game_no_in_wc] = win;
    let sc = g.ft[0]+'\u2013'+g.ft[1];
    if(g.pens) sc += ' ('+g.pens[0]+'\u2013'+g.pens[1]+' pens)';
    else if(g.et && (g.et[0]!==g.ft[0]||g.et[1]!==g.ft[1])) sc = g.et[0]+'\u2013'+g.et[1]+' a.e.t.';
    pscore[g.game_no_in_wc] = sc;
  });
  // to-proceed market odds: a straight "who advances" price per team (ET/pens already baked in).
  // Keyed by the sorted team pair so a tie can be looked up regardless of home/away order.
  const proceed={};
  db.odds.matches.filter(m=>m.stage==='knockout'&&m.proceed_1!=null&&m.proceed_2!=null).forEach(m=>{
    const k=[m.home,m.away].slice().sort().join('|');
    proceed[k]={[m.home]:m.proceed_1,[m.away]:m.proceed_2};
  });
  const completeList=letters.filter(L=>groupComplete[L]), incompleteList=letters.filter(L=>!groupComplete[L]);
  return {points,matches:MM,data_version:db.data_version,completeList,incompleteList,played,pscore,proceed};
}

const HOSTS = {USA:1, Mexico:1, Canada:1};
const HOST_BONUS = 60; // FIFA-points bump when "Host edge" is on

let mode = 'current';    // current | est
let host = false;
let half = 'full';
let picks = {};          // matchId -> team (manual pick, either mode)
let oddsCache = null;

const ROUND_NAMES = {R32:'Round of 32', R16:'Round of 16', QF:'Quarter-finals', SF:'Semi-finals', F:'Final', TP:'Third place'};
// vertical display order within each round column (encodes the bracket pairing)
const COL = {
  R32:[74,77,73,75,83,84,81,82, 76,78,79,80,86,88,85,87],
  R16:[89,90,93,94, 91,92,95,96],
  QF :[97,98, 99,100],
  SF :[101, 102],
  F  :[104]
};
const TOPSET = new Set([74,77,73,75,83,84,81,82,89,90,93,94,97,98,101]);

function pts(t){ return P[t] + ((host && HOSTS[t])?HOST_BONUS:0); }
function winProb(a,b){ return 1/(1+Math.pow(10, -(pts(a)-pts(b))/600)); }

// Does this exact tie have a bookmaker to-proceed price on the board?
function hasMarket(a,b){ return !!(PROCEED && PROCEED[[a,b].slice().sort().join('|')]); }
// P(a advances). Uses the market to-proceed price when the tie has one (margin removed),
// otherwise the FIFA-points model. Host edge only touches the model path — the market already prices home soil.
function advanceProb(a,b){
  const line = PROCEED && PROCEED[[a,b].slice().sort().join('|')];
  if(line && line[a] && line[b]){ const pa=1/line[a], pb=1/line[b]; return pa/(pa+pb); }
  return winProb(a,b);
}

// participants of a match given current resolution
function teamsOf(id){
  const m = M[id];
  if(m.round==='R32') return [m.a, m.b];
  if(m.losers){ // third place: losers of feeders
    return m.f.map(f=>loserOf(f));
  }
  return m.f.map(f=>winnerOf(f));
}
function winnerOf(id){
  if(PLAYED && PLAYED[id]!=null) return PLAYED[id];   // real result wins — never the model or a pick
  const [a,b] = teamsOf(id);
  if(a==null||b==null) return null;
  if(picks[id] && (picks[id]===a||picks[id]===b)) return picks[id];   // manual pick (either mode)
  if(mode==='est') return advanceProb(a,b)>=0.5 ? a : b;  // market where the tie has a price, else the model
  return null;                                        // Current bracket: unresolved until played or picked
}
function loserOf(id){
  const [a,b] = teamsOf(id); const w = winnerOf(id);
  return w===a ? b : a;
}

/* ---------- Monte Carlo ---------- */
// resolve one tie in a sim: real result locks it, then a manual pick (if that team is in the tie), else weighted coin-flip
function simWin(id,a,b){
  if(PLAYED[id]!=null) return PLAYED[id];
  if(picks[id]===a||picks[id]===b) return picks[id];
  return Math.random()<advanceProb(a,b)? a : b;
}
function monteCarlo(N){
  const cnt={}, fin={}, sf={}, r16={}, qf={};
  for(const t in P){cnt[t]=0;fin[t]=0;sf[t]=0;r16[t]=0;qf[t]=0;}
  for(let i=0;i<N;i++){
    const w={};
    for(const id of [73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88]){
      const m=M[id]; w[id]= simWin(id,m.a,m.b); r16[w[id]]++;
    }
    for(const id of [89,90,91,92,93,94,95,96]){
      const [a,b]=M[id].f.map(f=>w[f]); w[id]= simWin(id,a,b); qf[w[id]]++;
    }
    for(const id of [97,98,99,100]){
      const [a,b]=M[id].f.map(f=>w[f]); w[id]= simWin(id,a,b); sf[w[id]]++;
    }
    for(const id of [101,102]){
      const [a,b]=M[id].f.map(f=>w[f]); w[id]= simWin(id,a,b); fin[w[id]]++;
    }
    const [a,b]=M[104].f.map(f=>w[f]);
    const c= simWin(104,a,b); cnt[c]++;
  }
  return {N,cnt,fin,sf,r16,qf};
}
function getOdds(){ if(!oddsCache) oddsCache = monteCarlo(10000); return oddsCache; }

/* ---------- render ---------- */
const $ = s=>document.querySelector(s);
function fmtPts(t){ return (Math.round(P[t]*10)/10).toFixed(1); }

function render(){
  // data note
  var _cg=DATA.completeList.join(', '), _ig=DATA.incompleteList.join(', ');
  $('#datanote').innerHTML = 'Reads the live database — <b>data v'+DATA.data_version+'</b>. '+(DATA.incompleteList.length ? 'Groups <b>'+_cg+'</b> final; <b>'+_ig+'</b> + any dependent third-place slot stay the model\u2019s projection until tonight\u2019s games merge.' : 'All groups final — every Round-of-32 tie is the real draw.');

  const champ = winnerOf(104);
  const f1 = winnerOf(101), f2 = winnerOf(102);
  const est = (mode==='est');
  const od = est ? getOdds() : null;

  // hero
  $('#herolbl').textContent = est ? 'Projected champion' : (champ ? 'Your champion' : 'Current bracket');
  $('#champ').textContent = champ||'—';
  $('#champmeta').textContent = champ ? ('beats '+(winnerOf(104)===f1?f2:f1)+' in the final · '+fmtPts(champ)+' rating pts') : '';
  const wpc = (est && champ)? Math.round(1000*od.cnt[champ]/od.N)/10 : 0;
  $('#champpct').innerHTML = (est && champ) ? '<span class="big tnum">'+wpc.toFixed(1)+'%</span><span class="cap">title odds</span>' : '';
  $('#finalrow').innerHTML =
    fcell('Finalist',f1)+'<span class="vs">vs</span>'+fcell('Finalist',f2,true);

  // odds table — only in Best estimate
  $('#oddscard').style.display = est ? '' : 'none';
  if(est){
    const cap = host? 'Title odds — top 10 · host edge on' : 'Title odds — top 10';
    $('#tblcap').textContent = cap;
    const ranked = Object.keys(P).sort((a,b)=>od.cnt[b]-od.cnt[a]).slice(0,10);
    const max = od.cnt[ranked[0]]||1;
    $('#oddsbody').innerHTML = ranked.map((t,i)=>{
      const win=100*od.cnt[t]/od.N, fin=100*od.fin[t]/od.N;
      return '<tr><td class="rank">'+(i+1)+'</td><td class="team">'+t+'</td>'+
        '<td class="num">'+fin.toFixed(1)+'%</td><td class="num" style="color:var(--amber);font-weight:700">'+win.toFixed(1)+'%</td>'+
        '<td><div class="bar" style="width:'+Math.max(3,100*od.cnt[t]/max)+'%"></div></td></tr>';
    }).join('');
  }

  // controls visibility
  $('#hostbtn').style.display = est ? '' : 'none';          // host edge only affects the model
  $('#resetbtn').style.display = Object.keys(picks).length ? 'inline-block':'none';
  $('#resimbtn').style.display = est ? 'inline-block':'none';
  $('#modehint').textContent = est
    ? 'The model fills every tie not yet played (favourite advances); played ties are locked to the real result. Tap any team to change who goes through — the rest re-resolves, title odds included.'
    : 'The real bracket as it stands — played games and their winners only. Tap a team in any decided pairing to send them through and fill the bracket yourself. “Best estimate” predicts the rest.';

  drawBracket(champ, od);
}
function fcell(lbl,t,right){
  return '<div class="fteam" '+(right?'style="text-align:right"':'')+'><div class="lbl2">'+lbl+'</div><div class="t">'+(t||'—')+'</div></div>';
}

// champion route set
function routeSet(champ){
  const set=new Set();
  if(!champ) return set;
  const chain=[104,null]; // walk down
  function walk(id){
    set.add(id);
    const m=M[id]; if(m.round==='R32') return;
    for(const f of m.f){ if(winnerOf(f)===winnerOf(id)) walk(f); }
  }
  // only walk matches the champion actually appears in
  function walk2(id){
    const [a,b]=teamsOf(id);
    if(a!==champ&&b!==champ) return;
    set.add(id);
    const m=M[id]; if(m.round==='R32') return;
    for(const f of m.f) walk2(f);
  }
  walk2(104);
  return set;
}

function drawBracket(champ, od){
  const route = new Set();   // champion-route highlight removed
  const wrap = $('#bracket'); wrap.innerHTML='';

  // FULL DRAW = mirrored bracket: top half runs left→centre, bottom half runs right→centre,
  // the Final sits in the middle where the two halves meet (third place tucked beneath it).
  if(half==='full'){
    const specs = [
      ['R32','top'],['R16','top'],['QF','top'],['SF','top'],
      ['F','centre'],
      ['SF','bot'],['QF','bot'],['R16','bot'],['R32','bot']
    ];
    specs.forEach(([rk,side])=>{
      const col=document.createElement('div');
      col.className='round r-'+rk + (side==='bot'?' mirror':'') + (side==='centre'?' centre':'');
      const head=document.createElement('div'); head.className='rhead';
      head.innerHTML = rk==='F' ? '<b>Final</b>' : ROUND_NAMES[rk];
      col.appendChild(head);
      let ids = COL[rk];
      if(side==='top') ids=ids.filter(id=>TOPSET.has(id));
      else if(side==='bot') ids=ids.filter(id=>!TOPSET.has(id));
      ids.forEach(id=> col.appendChild(matchEl(id, route, od)) );
      if(side==='centre'){ // third-place under the final
        const tp=document.createElement('div'); tp.className='tp';
        tp.appendChild(matchEl(103, route, od, true));
        col.appendChild(tp);
      }
      wrap.appendChild(col);
    });
    return;
  }

  // TOP / BOTTOM = single-direction half view (compact, mobile-friendly)
  const cols = ['R32','R16','QF','SF','F'];
  cols.forEach(rk=>{
    const col=document.createElement('div'); col.className='round r-'+rk;
    let ids=COL[rk].filter(id=> half==='top' ? TOPSET.has(id) : !TOPSET.has(id));
    const head=document.createElement('div'); head.className='rhead';
    head.innerHTML = rk==='F' ? '<b>Final</b>' : ROUND_NAMES[rk];
    col.appendChild(head);
    ids.forEach(id=> col.appendChild(matchEl(id, route, od)) );
    wrap.appendChild(col);
  });
}

function matchEl(id, route, od, isTP){
  const m=M[id]; const [a,b]=teamsOf(id); const w=winnerOf(id);
  const el=document.createElement('div');
  el.className='match'+(m.round!=='R32'?' has-prev':'')+(['R32','R16','QF','SF'].includes(m.round)?' has-next':'');
  if(isTP) el.className='match';
  const card=document.createElement('div');
  const isPlayed = (PLAYED && PLAYED[id]!=null);
  const canPick = !isTP && a && b && !isPlayed;       // pick winners in either mode
  card.className='mcard'+(canPick?' clickable':'');
  // header line
  let tag='';
  if(m.round==='R32') tag = m.confirmed? '<span class="tag conf">CONFIRMED</span>' : '<span class="tag proj">PROJECTED</span>';
  const mno = isTP? 'Third place' : (m.round==='F'?'Final · M104':('M'+id));
  const sc = (PLAYED && PLAYED[id]!=null) ? '<span class="score">'+PSCORE[id]+'</span>' : '';
  card.innerHTML = '<div class="mno"><span>'+mno+'</span><span class="rt">'+tag+sc+'</span></div>';
  [a,b].forEach(t=>{
    let cls = 'out';                       // TBD / loser = dimmed
    if(t) cls = (w==null) ? '' : (t===w ? 'adv' : 'out');   // undecided pairing = neutral
    const s=document.createElement('div');
    s.className=('slot '+cls).trim();
    let right='';
    if(t && mode==='est' && a&&b && !isPlayed){ const opp=t===a?b:a; const pr=Math.round(100*advanceProb(t, opp)); const mk=hasMarket(a,b)?' mkt':''; right='<span class="pr tnum'+mk+'">'+pr+'%</span>'; }
    s.innerHTML='<span class="dot"></span><span class="nm'+(t?'':' tbd')+'">'+(t||tbdLabel(id,t===null))+'</span>'+right;
    if(t && canPick){
      s.onclick=()=>{ picks[id]=t; clearDownstream(id); oddsCache=null; render(); };
    }
    card.appendChild(s);
  });
  el.appendChild(card);
  return el;
}
function tbdLabel(id, isA){ return 'Winner ' + (M[id].f? 'M'+M[id].f[isA?0:1] : '—'); }

// when a pick changes, drop downstream picks that no longer make sense
function clearDownstream(id){
  // find match fed by id, recurse
  for(const k in M){ const m=M[k]; if(m.f && m.f.includes(+id)){ if(picks[k]) delete picks[k]; clearDownstream(+k); } }
}

/* ---------- wiring ---------- */
function setMode(x){ mode=x; picks={}; oddsCache=null;   // switching modes clears manual picks
  $('#m-current').setAttribute('aria-pressed',x==='current');
  $('#m-est').setAttribute('aria-pressed',x==='est');
  render();
}
$('#m-current').onclick=()=>setMode('current');
$('#m-est').onclick=()=>setMode('est');
function toggleHost(){ host=!host; oddsCache=null; $('#hostbtn').setAttribute('aria-pressed',host); render(); }
$('#hostbtn').onclick=toggleHost;
$('#hostbtn').onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();toggleHost();} };
$('#resetbtn').onclick=()=>{ picks={}; oddsCache=null; render(); };
$('#resimbtn').onclick=()=>{ oddsCache=null; render(); };
function setHalf(x){ half=x;
  $('#h-full').setAttribute('aria-pressed',x==='full');
  $('#h-top').setAttribute('aria-pressed',x==='top');
  $('#h-bot').setAttribute('aria-pressed',x==='bot');
  drawBracket(winnerOf(104), getOdds());
}
$('#h-full').onclick=()=>setHalf('full');
$('#h-top').onclick=()=>setHalf('top');
$('#h-bot').onclick=()=>setHalf('bot');

$('#foot').innerHTML = '<b>How the estimate works.</b> Each tie that has a bookmaker <b>to-proceed</b> price on the board is resolved with that price '+
  '(shown in <span style="color:var(--amber)">amber</span>) — a straight \u201Cwho goes through\u201D number with extra time and penalties already included. '+
  'Every other tie falls back to the project\u2019s FIFA-points model: advance probability = 1 / (1 + 10^(\u2212\u0394points/600)), the same Elo formula used elsewhere. '+
  'Knockout ties have no draw, so that probability is the advance probability. '+
  '\u201CHost edge\u201D adds +'+HOST_BONUS+' rating points to USA, Mexico and Canada (off by default); it only affects model ties, since a market price already prices home soil. '+
  'The bracket structure is FIFA\u2019s fixed schedule (matches 73\u2013104); third-place teams are slotted by the model where groups aren\u2019t final yet. '+
  'Ties tagged CONFIRMED come from the live board\u2019s real knockout fixtures; PROJECTED ties are model fills for games not yet drawn (and may differ from FIFA\u2019s exact Annex C slotting until they lock). <b>This is a model, not a settled fact.</b> · bracket_v5';

async function init(){
  $('#champ').textContent='Loading…';
  try{
    const res = await fetch('worldcup_db.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const db = await res.json();
    DATA = buildDATA(db); P = DATA.points; M = DATA.matches; PLAYED = DATA.played; PSCORE = DATA.pscore; PROCEED = DATA.proceed;
    render();
  }catch(e){
    $('#datanote').innerHTML = '<b style="color:var(--red)">Could not load worldcup_db.json</b> — '+e.message+
      '. This bracket reads the live data file, so open it on the site (or next to the JSON).';
    $('#champ').textContent='—';
  }
}
init();
</script>
